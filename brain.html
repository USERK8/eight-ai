<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Eight AI Brain</title>
</head>
<body>
  <script>
    const WORKER_URL = 'https://notifly.userk8-dev.workers.dev/';

    window.parent.postMessage({ type: 'ready' }, '*');

    window.addEventListener('message', async (e) => {
      if (e.data.type !== 'generate') return;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              {
                role: 'system',
                content: 'You are Eight AI, a helpful and intelligent assistant built by USERK8. Be concise and helpful.'
              },
              {
                role: 'user',
                content: e.data.prompt
              }
            ],
            max_tokens: 500,
            temperature: 0.7,
            stream: true
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let firstChunk = true;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

          for (const line of lines) {
            const data = line.replace('data: ', '').trim();
            if (data === '[DONE]') {
              // stream finished
              window.parent.postMessage({ type: 'done' }, '*');
              continue;
            }
            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices?.[0]?.delta?.content || '';
              if (!delta) continue;
              window.parent.postMessage({ 
                type: 'chunk', 
                text: delta,
                first: firstChunk
              }, '*');
              firstChunk = false;
            } catch {}
          }
        }

      } catch (err) {
        window.parent.postMessage({ type: 'error', message: err.message }, '*');
      }
    });
  </script>
</body>
</html>
