<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Eight AI Brain</title>
</head>
<body>
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers';

    // point to your HuggingFace repo
    env.allowRemoteModels = true;
    const MODEL_ID = 'userk8/eight-ai';

    let generator = null;

    async function loadModel() {
      try {
        generator = await pipeline('text-generation', MODEL_ID, {
          dtype: 'q4',         // use your 4bit quantized weights
          device: 'wasm',       // runs in browser cpu
        });

        // tell index.html we're ready
        window.parent.postMessage({ type: 'ready' }, '*');
      } catch (err) {
        window.parent.postMessage({ type: 'error', message: err.message }, '*');
      }
    }

    // listen for generate requests from index.html
    window.addEventListener('message', async (e) => {
      if (e.data.type !== 'generate') return;
      if (!generator) return;

      try {
        const result = await generator(e.data.prompt, {
          max_new_tokens: 200,
          temperature: 0.7,
          repetition_penalty: 1.1,
          do_sample: true,
        });

        // extract only the new generated text, not the prompt
        const fullText = result[0].generated_text;
        const responseText = fullText.slice(e.data.prompt.length).trim();

        window.parent.postMessage({ type: 'response', text: responseText }, '*');
      } catch (err) {
        window.parent.postMessage({ type: 'error', message: err.message }, '*');
      }
    });

    // start loading immediately
    loadModel();
  </script>
</body>
</html>
