<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Eight AI Brain</title>
</head>
<body>
  <script>
    const WORKER_URL = 'https://eight-ai-hf-spaces.userk8-dev.workers.dev/';

    window.parent.postMessage({ type: 'ready' }, '*');

    window.addEventListener('message', async (e) => {
      if (e.data.type !== 'generate') return;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: e.data.prompt,
            model: 'eight-2.0',
            preference: 'avg-guy' // Can be adjusted as needed
          })
        });

        const data = await response.json();

        if (data.error) {
          window.parent.postMessage({ type: 'error', message: data.error }, '*');
          return;
        }

        if (data.text) {
          // Pass the generated text back to the parent window
          window.parent.postMessage({ 
            type: 'chunk', 
            text: data.text,
            first: true
          }, '*');
        }
        
        // Signal that the generation is complete
        window.parent.postMessage({ type: 'done' }, '*');

      } catch (err) {
        window.parent.postMessage({ type: 'error', message: err.message }, '*');
      }
    });
  </script>
</body>
</html>
