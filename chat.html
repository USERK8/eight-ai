<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>eight ai · chat</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00e5ff;
      --cyan-dim: #00b8d4;
      --cyan-ghost: rgba(0,229,255,0.07);
      --bg: #000810;
      --surface: #0a0d1a;
      --border: #0d1f2d;
      --text: #c8d8e8;
      --muted: #4a5a6a; /* slightly lighter for readability */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 14px; /* Increased base size */
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(0,8,16,0.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-size: 15px; /* Clearer logo */
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-logo .inf {
      color: var(--cyan);
      animation: spinInf 6s linear infinite;
      display: inline-block;
    }

    @keyframes spinInf {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .nav-links { display: flex; gap: 8px; }

    .nav-links a {
      text-decoration: none;
      font-size: 12px; /* Bigger nav links */
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 4px;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      transition: all 0.2s;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .nav-links a:hover { color: var(--text); border-color: var(--muted); }

    #chat-output {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #chat-output::-webkit-scrollbar { width: 8px; }
    #chat-output::-webkit-scrollbar-track { background: transparent; }
    #chat-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { max-width: 80%; animation: fadeUp 0.25s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user { align-self: flex-end; }
    .msg-ai { align-self: flex-start; }

    .msg-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .msg-user .msg-label { color: var(--cyan); text-align: right; }
    .msg-ai .msg-label { color: var(--muted); }

    .msg-bubble {
      padding: 16px 20px; /* More padding */
      border-radius: 8px;
      font-size: 15px; /* Bigger, much more readable text */
      line-height: 1.6;
    }

    .msg-user .msg-bubble {
      background: var(--cyan);
      color: #000;
      font-weight: 700;
      border-bottom-right-radius: 2px;
    }

    .msg-ai .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #e0f0ff; /* Brighter text for AI response clarity */
      border-bottom-left-radius: 2px;
    }

    .code-block-wrap {
      position: relative;
      margin: 12px 0;
    }

    .code-block-wrap pre {
      background: #000;
      border: 1px solid var(--border);
      padding: 36px 14px 14px 14px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px; /* Bigger code blocks */
      color: var(--cyan);
      white-space: pre;
      font-family: 'JetBrains Mono', monospace;
    }

    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.2s;
    }

    .code-copy-btn:hover { color: var(--cyan); border-color: var(--cyan); }
    .code-copy-btn.copied { color: #4caf50; border-color: #4caf50; }

    .msg-ai .msg-bubble code {
      background: #000;
      padding: 3px 6px;
      border-radius: 4px;
      color: var(--cyan);
      font-size: 13px;
    }

    .thinking-dots span { animation: dot 1.2s infinite; opacity: 0; font-size: 18px;}
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    #input-area {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
      background: rgba(0,8,16,0.95);
      flex-shrink: 0;
    }

    #model-selector {
      display: flex;
      gap: 8px;
      max-width: 900px;
      margin: 0 auto 12px auto;
    }

    .model-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.2s;
      text-transform: lowercase;
    }

    .model-btn:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }

    .model-btn.active {
      color: var(--cyan);
      border-color: var(--cyan);
      background: var(--cyan-ghost);
    }

    .model-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-style: dashed;
    }

    #input-row {
      display: flex;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
      align-items: flex-end;
    }

    /* Plus Button & Menu */
    .plus-wrapper {
      position: relative;
      display: flex;
      align-items: flex-end;
    }

    #plus-btn {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--cyan);
      font-size: 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #plus-btn:hover { border-color: var(--cyan); background: var(--cyan-ghost); }

    #plus-menu {
      position: absolute;
      bottom: 60px;
      left: 0;
      background: rgba(0,8,16,0.95);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    #plus-menu.hidden { display: none; }

    .plus-item {
      padding: 10px 14px;
      font-size: 13px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .plus-item.disabled {
      color: var(--muted);
      cursor: not-allowed;
      background: var(--surface);
      opacity: 0.7;
    }

    /* Text Input Area */
    #user-input {
      flex: 1;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; /* clearer typing */
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      border-radius: 6px;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: none;
      overflow: hidden;
      min-height: 48px;
      max-height: 200px;
      line-height: 1.6;
    }

    #user-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(0,229,255,0.08);
    }
    #user-input::placeholder { color: var(--muted); }

    /* Model Preferences Dropdown */
    #model-pref {
      height: 48px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }

    #model-pref:focus, #model-pref:hover { border-color: var(--cyan); }
    #model-pref.hidden { display: none; }
    
    #model-pref option { background: var(--bg); color: var(--text); }

    /* Send Button */
    #send-btn {
      padding: 0 24px;
      background: var(--cyan);
      color: #000;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      height: 48px;
    }

    #send-btn:hover {
      background: var(--cyan-dim);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,229,255,0.2);
    }

    #send-btn:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #status {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: 0.1em;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0,229,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.012) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">
      userk8 <span class="inf">8</span> eight ai
    </div>
    <div class="nav-links">
      <a href="index.html">← back</a>
      <a href="https://userk8.github.io/USERK8-HUB/">userk8</a>
    </div>
  </nav>

  <div id="chat-output">
    <div class="msg msg-ai">
      <div class="msg-label">eight ai</div>
      <div class="msg-bubble">hey, i'm eight ai. what are we messing with today? 👋</div>
    </div>
  </div>

  <div id="input-area">
    <div id="model-selector">
      <button class="model-btn active" data-model="eight-1.0" data-label="eight 1.0">eight 1.0</button>
      <button class="model-btn" data-model="eight-2.0" data-label="eight 2.0">eight 2.0</button>
    </div>
    <div id="input-row">
      <div class="plus-wrapper">
        <button id="plus-btn">+</button>
        <div id="plus-menu" class="hidden">
          <div class="plus-item disabled">🖼️ image (coming soon)</div>
          <div class="plus-item disabled">📄 files (coming soon)</div>
        </div>
      </div>
      
      <textarea id="user-input" placeholder="ask something... (shift+enter for new line)" rows="1"></textarea>
      
      <select id="model-pref" class="hidden">
        <option value="lightning-mcqueen">Lightning McQueen</option>
        <option value="avg-guy" selected>avg guy</option>
        <option value="overthinker">overthinker</option>
        <option value="overthinker-pro">overthinker pro</option>
      </select>

      <button id="send-btn">send</button>
    </div>
    <div id="status">userk8 · eight ai · eight 1.0</div>
  </div>

  <script>
    const WORKER_URL = 'https://eight-ai-hf-spaces.userk8-dev.workers.dev/';
    const output = document.getElementById('chat-output');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const status = document.getElementById('status');
    const modelPrefSelect = document.getElementById('model-pref');
    
    // Plus Menu Logic
    const plusBtn = document.getElementById('plus-btn');
    const plusMenu = document.getElementById('plus-menu');
    
    plusBtn.addEventListener('click', () => {
      plusMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.plus-wrapper')) {
        plusMenu.classList.add('hidden');
      }
    });

    let selectedModel = 'eight-1.0';
    let selectedLabel = 'eight 1.0';

    // Model selector logic
    document.querySelectorAll('.model-btn').forEach(b => {
      b.addEventListener('click', () => {
        if (b.disabled) return; 
        document.querySelectorAll('.model-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        selectedModel = b.dataset.model;
        selectedLabel = b.dataset.label;
        status.textContent = `userk8 · eight ai · ${selectedLabel}`;

        // Toggle drop down visibility based on model
        if (selectedModel === 'eight-2.0') {
          modelPrefSelect.classList.remove('hidden');
        } else {
          modelPrefSelect.classList.add('hidden');
        }
      });
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    });

    function renderMarkdown(raw) {
      const parts = raw.split(/(```[\w]*\n?[\s\S]*?```)/g);
      return parts.map(part => {
        if (part.startsWith('```')) {
          const code = part.replace(/^```[\w]*\n?/, '').replace(/```$/, '').trim();
          const escaped = code
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          return `<div class="code-block-wrap">
            <button class="code-copy-btn" onclick="copyCode(this)" data-code="${encodeURIComponent(code)}">copy</button>
            <pre>${escaped}</pre>
          </div>`;
        } else {
          return part
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/`([^`\n]{1,80})`/g, '<code>$1</code>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');
        }
      }).join('');
    }

    window.copyCode = function(btn) {
      const code = decodeURIComponent(btn.dataset.code);
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = 'copied ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    };

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg msg-user';
      userDiv.innerHTML = `<div class="msg-label">you</div><div class="msg-bubble">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>`;
      output.appendChild(userDiv);

      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg msg-ai';
      aiDiv.innerHTML = `<div class="msg-label">eight ai</div><div class="msg-bubble"><span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
      output.appendChild(aiDiv);
      output.scrollTop = output.scrollHeight;

      input.value = '';
      input.style.height = '48px';
      btn.disabled = true;
      input.disabled = true;
      plusBtn.disabled = true;
      status.textContent = `generating via ${selectedLabel}...`;

      const bubble = aiDiv.querySelector('.msg-bubble');

      try {
        // Prepare dynamic request payload
        const payload = { message: text, model: selectedModel };
        
        // Append preference if Eight 2.0 is used
        if (selectedModel === 'eight-2.0') {
          payload.preference = modelPrefSelect.value;
        }

        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          bubble.textContent = `error: ${data.error}`;
        } else {
          const raw = data.text || 'no response';
          bubble.innerHTML = renderMarkdown(raw);
        }

        output.scrollTop = output.scrollHeight;

      } catch (err) {
        bubble.textContent = `error: ${err.message}`;
      }

      btn.disabled = false;
      input.disabled = false;
      plusBtn.disabled = false;
      status.textContent = `userk8 · eight ai · ${selectedLabel}`;
      input.focus();
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
