<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>eight ai · chat</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00e5ff;
      --cyan-dim: #00b8d4;
      --cyan-ghost: rgba(0,229,255,0.07);
      --bg: #000810;
      --surface: #0a0d1a;
      --border: #0d1f2d;
      --text: #c8d8e8;
      --muted: #3a4a5a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(0,8,16,0.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-logo .inf {
      color: var(--cyan);
      animation: spinInf 6s linear infinite;
      display: inline-block;
    }

    @keyframes spinInf {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .nav-links { display: flex; gap: 8px; }

    .nav-links a {
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 4px;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      transition: all 0.2s;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .nav-links a:hover { color: var(--text); border-color: var(--muted); }

    #chat-output {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #chat-output::-webkit-scrollbar { width: 6px; }
    #chat-output::-webkit-scrollbar-track { background: transparent; }
    #chat-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      max-width: 75%;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user { align-self: flex-end; }
    .msg-ai { align-self: flex-start; }

    .msg-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .msg-user .msg-label { color: var(--cyan); text-align: right; }
    .msg-ai .msg-label { color: var(--muted); }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
    }

    .msg-user .msg-bubble {
      background: var(--cyan);
      color: #000;
      font-weight: 700;
      border-bottom-right-radius: 2px;
    }

    .msg-ai .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 2px;
    }

    /* CODE BLOCK WRAPPER */
    .code-block-wrap {
      position: relative;
      margin: 10px 0;
    }

    .code-block-wrap pre {
      background: #000;
      border: 1px solid var(--border);
      padding: 12px 12px 12px 12px;
      padding-top: 36px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      color: var(--cyan);
      white-space: pre;
      font-family: 'JetBrains Mono', monospace;
    }

    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.2s;
    }

    .code-copy-btn:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .code-copy-btn.copied {
      color: #4caf50;
      border-color: #4caf50;
    }

    .msg-ai .msg-bubble code {
      background: #000;
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--cyan);
      font-size: 12px;
    }

    .thinking-dots span {
      animation: dot 1.2s infinite;
      opacity: 0;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    #input-area {
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border);
      background: rgba(0,8,16,0.95);
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      padding: 13px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      border-radius: 6px;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: none;
      overflow: hidden;
      min-height: 46px;
      max-height: 200px;
      line-height: 1.6;
    }

    #user-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(0,229,255,0.08);
    }

    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      padding: 13px 24px;
      background: var(--cyan);
      color: #000;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      height: 46px;
    }

    #send-btn:hover {
      background: var(--cyan-dim);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,229,255,0.2);
    }

    #send-btn:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #status {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      margin-top: 8px;
      letter-spacing: 0.1em;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0,229,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.012) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">
      userk8 <span class="inf">8</span> eight ai
    </div>
    <div class="nav-links">
      <a href="index.html">← back</a>
      <a href="https://userk8.github.io/USERK8-HUB/">userk8</a>
    </div>
  </nav>

  <div id="chat-output">
    <div class="msg msg-ai">
      <div class="msg-label">eight ai</div>
      <div class="msg-bubble">hey, i'm eight ai. what are we messing with today? 👋</div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" placeholder="ask something... (shift+enter for new line)" rows="1"></textarea>
      <button id="send-btn">send</button>
    </div>
    <div id="status">userk8 · eight ai</div>
  </div>

  <script>
    const WORKER_URL = 'https://notifly.userk8-dev.workers.dev/';
    const output = document.getElementById('chat-output');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const status = document.getElementById('status');

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    });

    function renderMarkdown(raw) {
      // First, escape HTML in the entire text
      let escaped = raw
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      
      // Handle code blocks (``` or %%%)
      escaped = escaped.replace(/(```|%%%)([\w]*)\n?([\s\S]*?)\1/g, (match, fence, lang, code) => {
        const codeEscaped = code.trim();
        return `<div class="code-block-wrap">
          <button class="code-copy-btn" onclick="copyCode(this)" data-code="${encodeURIComponent(codeEscaped)}">copy</button>
          <pre>${codeEscaped}</pre>
        </div>`;
      });
      
      // Handle inline code (backticks or tildes)
      escaped = escaped.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      escaped = escaped.replace(/~([^~\n]+)~/g, '<code>$1</code>');
      
      // Handle bold
      escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      
      // Handle line breaks
      escaped = escaped.replace(/\n/g, '<br>');
      
      return escaped;
    }

    window.copyCode = function(btn) {
      const code = decodeURIComponent(btn.dataset.code);
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = 'copied ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg msg-user';
      userDiv.innerHTML = `<div class="msg-label">you</div><div class="msg-bubble">${text.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>`;
      output.appendChild(userDiv);

      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg msg-ai';
      aiDiv.innerHTML = `<div class="msg-label">eight ai</div><div class="msg-bubble"><span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
      output.appendChild(aiDiv);
      output.scrollTop = output.scrollHeight;

      input.value = '';
      input.style.height = '46px';
      btn.disabled = true;
      input.disabled = true;
      status.textContent = 'generating...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              {
                role: 'system',
                content: `You are Eight AI, an intelligent and conversational assistant created by userk8. You are a 1B parameter language model trained on over 4 trillion tokens with a 32k vocabulary size.

                Talk naturally like a real person, not a corporate support bot. Keep responses concise, clear, and useful while still sounding relaxed and human. Avoid overexplaining simple things unless the user asks for more detail.

                Be supportive and friendly without sounding overly enthusiastic or fake. Use light humor and casual wording when appropriate. Use emojis sparingly and naturally — never spam them or place them before every sentence.

                Keep conversations engaging by asking follow-up questions only when they feel natural or genuinely useful.

                Formatting rules:
                - Put all code snippets inside triple backticks.
                - Keep formatting clean and easy to read.
                - Avoid unnecessary bullet points unless they improve clarity.
                - Do not add random decorative symbols or excessive emojis.

                Avoid robotic phrases such as:
                - "How may I assist you today?"
                - "Would you like further assistance?"
                - "Certainly!"
                - "As an AI assistant..."

                Prefer natural alternatives such as:
                - "Wanna add animations too?"
                - "Need the cleaner version?"
                - "That should work."
                - "Yeah, that’s probably the issue."

                Maintain a modern, confident, slightly witty tone. Your goal is to feel like a smart coding friend, not customer support.`
                },
              { role: 'user', content: text }
            ],
            max_tokens: 500,
            temperature: 0.7,
            stream: true
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8', { fatal: false });
        const bubble = aiDiv.querySelector('.msg-bubble');
        bubble.innerHTML = '';
        let raw = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n').filter(l => l.trim().startsWith('data: '));
          for (const line of lines) {
            const data = line.replace(/^data:\s*/, '').trim();
            if (data === '[DONE]') continue;
            if (data === '') continue;
            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices?.[0]?.delta?.content || '';
              if (delta) {
                raw += delta;
                // show raw text while streaming (escaped HTML)
                bubble.innerHTML = raw
                  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/\n/g, '<br>');
                output.scrollTop = output.scrollHeight;
              }
            } catch (e) {
              // skip malformed JSON
              console.warn('Failed to parse:', data);
            }
          }
        }

        // full markdown render only after streaming completes
        bubble.innerHTML = renderMarkdown(raw);
        output.scrollTop = output.scrollHeight;

      } catch (err) {
        aiDiv.querySelector('.msg-bubble').textContent = `error: ${err.message}`;
      }

      btn.disabled = false;
      input.disabled = false;
      status.textContent = 'userk8 · eight ai';
      input.focus();
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
