<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>eight ai | userk8</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #000810 50%, #001a1a 100%);
      background-attachment: fixed;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }

    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 20px;
    }

    #spinning-eight {
      font-size: clamp(120px, 25vw, 280px);
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #00e5ff 0%, #00b8d4 50%, #0097a7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: spinInfinity 8s linear infinite;
      margin-bottom: 60px;
      filter: drop-shadow(0 0 40px rgba(0, 229, 255, 0.4));
    }

    @keyframes spinInfinity {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #typing-container {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 80px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 20px;
    }

    #typing-text {
      font-size: clamp(24px, 4vw, 36px);
      color: #00e5ff;
      font-weight: 400;
      letter-spacing: 0.5px;
      line-height: 1.5;
      text-align: center;
    }

    .cursor {
      animation: blink 0.8s infinite;
      color: #00e5ff;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    #chat-section {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    #chat-output {
      width: 100%;
      height: 400px;
      overflow-y: auto;
      border: 1px solid #1a1a1a;
      padding: 20px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.7;
      background: #0a0a0a;
      border-radius: 8px;
    }

    #chat-output::-webkit-scrollbar { width: 8px; }
    #chat-output::-webkit-scrollbar-track { background: #0a0a0a; }
    #chat-output::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 4px; }
    #chat-output::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }

    .msg-user { color: #fff; margin-bottom: 12px; animation: slideIn 0.3s ease; }
    .msg-user span { font-weight: bold; color: #00e5ff; }
    .msg-ai { color: #ccc; margin-bottom: 12px; animation: slideIn 0.3s ease; }
    .msg-ai span { font-weight: bold; color: #00b8d4; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #input-row {
      display: flex;
      width: 100%;
      gap: 12px;
    }

    #user-input {
      flex: 1;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      border: 1px solid #222;
      background: #0a0a0a;
      color: #fff;
      outline: none;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    #user-input:focus { 
      border-color: #00e5ff; 
      box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.1);
    }
    #user-input::placeholder { color: #444; }

    #send-btn {
      padding: 14px 28px;
      background: #00e5ff;
      color: #000;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-transform: lowercase;
    }

    #send-btn:hover { 
      background: #00b8d4; 
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
    }
    #send-btn:active { transform: translateY(0); }
    #send-btn:disabled { 
      background: #1a1a1a; 
      color: #444; 
      cursor: not-allowed;
      transform: none;
    }

    #status { 
      margin-top: 12px; 
      font-size: 12px; 
      color: #444;
      text-align: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 151, 167, 0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <section id="hero">
    <div id="spinning-eight">8</div>
    <div id="typing-container">
      <span id="typing-text"></span><span class="cursor">|</span>
    </div>
  </section>

  <section id="chat-section">
    <div id="chat-output">
      <div class="msg-ai"><span>eight ai:</span> ready. ask me anything.</div>
    </div>
    <div id="input-row">
      <input id="user-input" type="text" placeholder="type something..."/>
      <button id="send-btn">send</button>
    </div>
    <div id="status">ready.</div>
  </section>

  <script>
    // Typing animation
    const phrases = [
      "want to write something?\ni can draft it for you",
      "need help with code?\nlet's debug together",
      "stuck on a problem?\ni'll help you think it through",
      "ideas floating around?\nlet's organize them",
      "creative block?\ni can help brainstorm",
      "questions on your mind?\nanswers coming up",
      "need a second opinion?\nfire away, i'm listening"
    ];

    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typingSpeed = 50;
    const typingElement = document.getElementById('typing-text');

    function type() {
      const currentPhrase = phrases[phraseIndex];
      if (isDeleting) {
        typingElement.innerHTML = currentPhrase.substring(0, charIndex - 1).replace(/\n/g, '<br>');
        charIndex--;
        typingSpeed = 25;
      } else {
        typingElement.innerHTML = currentPhrase.substring(0, charIndex + 1).replace(/\n/g, '<br>');
        charIndex++;
        typingSpeed = 50;
      }
      if (!isDeleting && charIndex === currentPhrase.length) {
        isDeleting = true;
        typingSpeed = 3000;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length;
        typingSpeed = 500;
      }
      setTimeout(type, typingSpeed);
    }
    setTimeout(type, 1000);

    // Chat
    const WORKER_URL = 'https://notifly.userk8-dev.workers.dev/';
    const output = document.getElementById('chat-output');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const status = document.getElementById('status');

    function renderMarkdown(raw) {
      return raw
        .replace(/\*\*(.*?)\*\*/gs, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg-user';
      userDiv.innerHTML = `<span>you:</span> ${text}`;
      output.appendChild(userDiv);

      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg-ai';
      aiDiv.innerHTML = `<span>eight ai:</span> `;
      aiDiv.dataset.raw = '';
      output.appendChild(aiDiv);
      output.scrollTop = output.scrollHeight;

      input.value = '';
      btn.disabled = true;
      input.disabled = true;
      status.textContent = 'generating...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              {
                role: 'system',
                content: 'You are Eight AI, a helpful and intelligent assistant built by USERK8. Be concise and helpful.'
              },
              { role: 'user', content: text }
            ],
            max_tokens: 500,
            temperature: 0.7,
            stream: true
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

          for (const line of lines) {
            const data = line.replace('data: ', '').trim();
            if (data === '[DONE]') continue;
            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices?.[0]?.delta?.content || '';
              if (delta) {
                aiDiv.dataset.raw += delta;
                aiDiv.innerHTML = '<span>eight ai:</span> ' + renderMarkdown(aiDiv.dataset.raw);
                output.scrollTop = output.scrollHeight;
              }
            } catch {}
          }
        }

      } catch (err) {
        aiDiv.innerHTML += `error: ${err.message}`;
      }

      btn.disabled = false;
      input.disabled = false;
      status.textContent = 'ready.';
      input.focus();
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
