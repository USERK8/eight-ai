<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eight AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }
    #chat-output {
      width: 600px;
      max-width: 90vw;
      height: 400px;
      overflow-y: auto;
      border: 1px solid #1a1a1a;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
      background: #0a0a0a;
    }
    .msg-user { color: #fff; margin-bottom: 8px; }
    .msg-user span { font-weight: bold; color: #00e5ff; }
    .msg-ai { color: #ccc; margin-bottom: 8px; }
    .msg-ai span { font-weight: bold; color: #00b8d4; }
    #input-row {
      display: flex;
      width: 600px;
      max-width: 90vw;
      gap: 8px;
    }
    #user-input {
      flex: 1;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #222;
      background: #0a0a0a;
      color: #fff;
      outline: none;
    }
    #user-input:focus { border-color: #00e5ff; }
    #user-input::placeholder { color: #444; }
    #send-btn {
      padding: 10px 20px;
      background: #00e5ff;
      color: #000;
      border: none;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #send-btn:hover { background: #00b8d4; }
    #send-btn:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <div id="chat-output">
    <div class="msg-ai"><span>eight ai:</span> ready. ask me anything.</div>
  </div>
  <div id="input-row">
    <input id="user-input" type="text" placeholder="type something..."/>
    <button id="send-btn">send</button>
  </div>
  <div id="status">ready.</div>

  <script>
    const WORKER_URL = 'https://notifly.userk8-dev.workers.dev/';
    const output = document.getElementById('chat-output');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const status = document.getElementById('status');

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // show user message
      const userDiv = document.createElement('div');
      userDiv.className = 'msg-user';
      userDiv.innerHTML = `<span>you:</span> ${text}`;
      output.appendChild(userDiv);

      // create ai bubble
      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg-ai';
      aiDiv.innerHTML = `<span>eight ai:</span> `;
      output.appendChild(aiDiv);
      output.scrollTop = output.scrollHeight;

      input.value = '';
      btn.disabled = true;
      input.disabled = true;
      status.textContent = 'generating...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              {
                role: 'system',
                content: 'You are Eight AI, a helpful and intelligent assistant built by USERK8. Be concise and helpful.'
              },
              { role: 'user', content: text }
            ],
            max_tokens: 500,
            temperature: 0.7,
            stream: true
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));

          for (const line of lines) {
            const data = line.replace('data: ', '').trim();
            if (data === '[DONE]') continue;
            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices?.[0]?.delta?.content || '';
              if (delta) {
                aiDiv.innerHTML += delta;
                output.scrollTop = output.scrollHeight;
              }
            } catch {}
          }
        }

      } catch (err) {
        aiDiv.innerHTML += `error: ${err.message}`;
      }

      btn.disabled = false;
      input.disabled = false;
      status.textContent = 'ready.';
      input.focus();
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
