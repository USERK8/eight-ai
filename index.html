<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eight AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }

    #chat-output {
      width: 600px;
      max-width: 90vw;
      height: 400px;
      overflow-y: auto;
      border: 1px solid #1a1a1a;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: #e0e0e0;
      background: #0a0a0a;
    }

    .msg-user { color: #fff; margin-bottom: 8px; }
    .msg-user span { font-weight: bold; color: #00e5ff; }
    .msg-ai { color: #ccc; margin-bottom: 8px; }
    .msg-ai span { font-weight: bold; color: #00b8d4; }

    #input-row {
      display: flex;
      width: 600px;
      max-width: 90vw;
      gap: 8px;
    }

    #user-input {
      flex: 1;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #222;
      background: #0a0a0a;
      color: #fff;
      outline: none;
    }

    #user-input:focus { border-color: #00e5ff; }
    #user-input::placeholder { color: #444; }

    #send-btn {
      padding: 10px 20px;
      background: #00e5ff;
      color: #000;
      border: none;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #send-btn:hover { background: #00b8d4; }
    #send-btn:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #444;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div id="chat-output">
    <div class="msg-ai"><span>eight ai:</span> loading model, please wait...</div>
  </div>

  <div id="input-row">
    <input id="user-input" type="text" placeholder="type something..." disabled/>
    <button id="send-btn" disabled>send</button>
  </div>

  <div id="status">initializing...</div>

  <!-- brain iframe hidden, handles all model logic -->
  <iframe id="brain" src="brain.html" style="display:none;"></iframe>

  <script>
    const output = document.getElementById('chat-output');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const status = document.getElementById('status');
    const brain = document.getElementById('brain');

    // listen for messages from brain.html
    window.addEventListener('message', (e) => {
      if (e.data.type === 'ready') {
        status.textContent = 'model loaded. ready.';
        input.disabled = false;
        btn.disabled = false;
        output.innerHTML = '<div class="msg-ai"><span>eight ai:</span> ready. ask me anything.</div>';
      }

      if (e.data.type === 'response') {
        // remove thinking indicator
        const thinking = document.getElementById('thinking');
        if (thinking) thinking.remove();

        const div = document.createElement('div');
        div.className = 'msg-ai';
        div.innerHTML = `<span>eight ai:</span> ${e.data.text}`;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
        btn.disabled = false;
        input.disabled = false;
        status.textContent = 'ready.';
      }

      if (e.data.type === 'error') {
        const thinking = document.getElementById('thinking');
        if (thinking) thinking.remove();
        status.textContent = 'error: ' + e.data.message;
        btn.disabled = false;
        input.disabled = false;
      }
    });

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // show user message
      const userDiv = document.createElement('div');
      userDiv.className = 'msg-user';
      userDiv.innerHTML = `<span>you:</span> ${text}`;
      output.appendChild(userDiv);

      // show thinking
      const thinkDiv = document.createElement('div');
      thinkDiv.className = 'msg-ai';
      thinkDiv.id = 'thinking';
      thinkDiv.innerHTML = `<span>eight ai:</span> thinking...`;
      output.appendChild(thinkDiv);
      output.scrollTop = output.scrollHeight;

      // send to brain
      brain.contentWindow.postMessage({ type: 'generate', prompt: text }, '*');

      input.value = '';
      btn.disabled = true;
      input.disabled = true;
      status.textContent = 'generating...';
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
